name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      # Восстанавливаем историю из прошлого запуска
      - name: Restore Allure History
        uses: actions/cache@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      # Копируем историю в результаты
      - name: Prepare history
        run: |
          mkdir -p allure-results/history
          if [ -d "allure-history/latest" ]; then
            cp -r allure-history/latest/history/* allure-results/history/ || true
          fi

      # Запуск тестов
      - name: Run tests
        run: pytest --alluredir=allure-results

      # Генерируем отчет с историей
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      # Публикуем отчет на GitHub Pages
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history