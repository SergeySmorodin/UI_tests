name: UI Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest allure-pytest playwright pytest-playwright
        python -m playwright install chromium

    - name: Restore Allure History
      uses: actions/cache@v4
      with:
        path: allure-history
        key: allure-history-${{ github.run_id }}
        restore-keys: allure-history-

    - name: Prepare history
      run: |
        mkdir -p allure-results/history
        if [ -d "allure-history/latest" ]; then
          cp -r allure-history/latest/history/* allure-results/history/ || true
        fi

    - name: Run tests
      env:
        LOGIN: ${{ secrets.LOGIN }}
        PASSWORD: ${{ secrets.PASSWORD }}
        SITE_URL: ${{ secrets.SITE_URL }}
      run: pytest --alluredir=allure-results
      continue-on-error: true

    - name: Generate Allure Report
      if: always()
      uses: simple-elf/allure-report-action@v1.9
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-history